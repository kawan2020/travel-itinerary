<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details & Location</title>
    <link rel="stylesheet" href="style.css">
    <script src="xlsx.full.min.js"></script>
    <style>
        .info-container { max-width: 800px; margin: 30px auto; background: #fff; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-radius: 4px; }
        .back-btn { display: inline-block; background-color: #1a446c; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
        .back-btn:hover { background-color: #2a6496; }
        .media-box { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .detail-img { width: 100%; height: 300px; object-fit: cover; border: 1px solid #b1c4d4; border-radius: 4px; background-color: #eaeaea; }
        .map-frame { width: 100%; height: 300px; border: 1px solid #b1c4d4; border-radius: 4px; }
        .item-title { color: #1a446c; font-size: 24px; margin: 0 0 10px 0; border-bottom: 2px solid #1a446c; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div class="info-container">
        <a href="index.html" class="back-btn">⬅️ Return to Itinerary</a>
        
        <h1 id="detail-name">Loading Details...</h1>
        <p><strong>Type/Service:</strong> <span id="detail-type">-</span></p>
        <p><strong>Location/Address:</strong> <span id="detail-address">-</span></p>
        <p><strong>Booking Reference:</strong> <span id="detail-ref">-</span></p>

        <div class="media-box">
            <div>
                <h3>🖼️ Visual Preview</h3>
                <img id="detail-image" class="detail-img" src="" alt="Preview Image" onerror="this.src='https://placehold.co'">
            </div>
            <div>
                <h3>🗺️ Live Location Map</h3>
                <div id="map-container">
                    <!-- Secure Map Element Placeholder Component -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const itemId = urlParams.get('id');
            const passedAddress = urlParams.get('address'); 

            if (!itemId) {
                document.getElementById('detail-name').innerText = "No item selected.";
                return;
            }

            document.getElementById('detail-image').src = `Images/${itemId}.jpg`;

            fetch('./Data/itinerary.xlsx')
                .then(res => res.arrayBuffer())
                .then(buffer => {
                    const data = new Uint8Array(buffer);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const tabs = ['Transportation', 'Accommodation', 'Activities'];
                    let found = false;

                    for (let tabName of tabs) {
                        const sheet = workbook.Sheets[tabName];
                        if (!sheet) continue;

                        let rowIndex = 4;
                        while (true) {
                            if (!sheet[`A${rowIndex}`]) break;

                            let refId = '';
                            if (tabName === 'Transportation') refId = sheet[`H${rowIndex}`]?.v;
                            if (tabName === 'Accommodation') refId = sheet[`F${rowIndex}`]?.v;
                            if (tabName === 'Activities') refId = sheet[`F${rowIndex}`]?.v;

                            if (String(refId).trim() === itemId) {
                                found = true;
                                if (tabName === 'Transportation') {
                                    document.getElementById('detail-name').innerText = sheet[`D${rowIndex}`]?.v || 'Transport';
                                    document.getElementById('detail-type').innerText = sheet[`C${rowIndex}`]?.v || '-';
                                    document.getElementById('detail-address').innerText = passedAddress || sheet[`E${rowIndex}`]?.v || 'Airport/Station';
                                    document.getElementById('detail-ref').innerText = sheet[`G${rowIndex}`]?.v || '-';
                                } else if (tabName === 'Accommodation') {
                                    document.getElementById('detail-name').innerText = sheet[`B${rowIndex}`]?.v || 'Hotel';
                                    document.getElementById('detail-type').innerText = "Hotel Stay";
                                    document.getElementById('detail-address').innerText = `${sheet[`C${rowIndex}`]?.v || ''}, ${sheet[`D${rowIndex}`]?.v || ''}`;
                                    document.getElementById('detail-ref').innerText = sheet[`E${rowIndex}`]?.v || '-';
                                } else if (tabName === 'Activities') {
                                    document.getElementById('detail-name').innerText = sheet[`C${rowIndex}`]?.v || 'Activity';
                                    document.getElementById('detail-type').innerText = "Scheduled Event";
                                    document.getElementById('detail-address').innerText = passedAddress || sheet[`D${rowIndex}`]?.v || '-';
                                    document.getElementById('detail-ref').innerText = sheet[`E${rowIndex}`]?.v || '-';
                                }

                                // Secure HTTPS Embedded Google Maps Generation
                                const fullAddress = document.getElementById('detail-address').innerText;
                                const encodedAddress = encodeURIComponent(fullAddress);
                                
                                document.getElementById('map-container').innerHTML = `
                                    <iframe 
                                        class="map-frame" 
                                        loading="lazy" 
                                        allowfullscreen 
                                        src="https://google.com{encodedAddress}&output=embed&iwloc=near">
                                    </iframe>`;
                                break;
                            }
                            rowIndex++;
                        }
                        if (found) break;
                    }
                    if (!found) {
                        document.getElementById('detail-name').innerText = "Item details not found.";
                        // Fallback handling to render maps using link parameters directly if data arrays misalign
                        if (passedAddress) {
                            document.getElementById('detail-name').innerText = itemId.replace(/-/g, ' ').toUpperCase();
                            document.getElementById('detail-address').innerText = passedAddress;
                            const encodedAddress = encodeURIComponent(passedAddress);
                            document.getElementById('map-container').innerHTML = `
                                <iframe class="map-frame" loading="lazy" allowfullscreen src="https://google.com{encodedAddress}&output=embed&iwloc=near"></iframe>`;
                        }
                    }
                });
        });
    </script>
</body>
</html>
