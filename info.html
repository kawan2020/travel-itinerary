<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details & Location</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load SheetJS to read your Excel fields dynamically -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Custom layout styling specific to the Details Page */
        .info-container { max-width: 800px; margin: 30px auto; background: #fff; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-radius: 4px; }
        .back-btn { display: inline-block; background-color: #1a446c; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
        .back-btn:hover { background-color: #2a6496; }
        .media-box { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .detail-img { width: 100%; hieght: auto; max-height: 300px; object-fit: cover; border: 1px solid #b1c4d4; border-radius: 4px; background-color: #eaeaea; }
        iframe { width: 100%; height: 300px; border: 1px solid #b1c4d4; border-radius: 4px; }
        .item-title { color: #1a446c; font-size: 24px; margin: 0 0 10px 0; border-bottom: 2px solid #1a446c; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div class="info-container">
        <!-- The Return Button to go back home -->
        <a href="index.html" class="back-btn">⬅️ Return to Itinerary</a>
        
        <h1 id="detail-name">Loading Details...</h1>
        <p><strong>Location/Address:</strong> <span id="detail-address">-</span></p>
        <p><strong>Booking Reference:</strong> <span id="detail-ref">-</span></p>

        <!-- Media Box: Left side is the Image, Right side is the live Map -->
        <div class="media-box">
            <div>
                <h3>🏨 Hotel Preview</h3>
                <img id="detail-image" class="detail-img" src="" alt="Hotel Image Preview">
            </div>
            <div>
                <h3>🗺️ Live Location Map</h3>
                <div id="map-container">
                    <!-- Google Map will load here automatically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Grab the "ID" from the website address (URL) bar (e.g. ?id=hotel-radisson)
            const urlParams = new URLSearchParams(window.location.search);
            const itemId = urlParams.get('id');

            if (!itemId) {
                document.getElementById('detail-name').innerText = "No item selected.";
                return;
            }

            // 2. Automatically link the image matching your exact Excel string name
            document.getElementById('detail-image').src = `Images/${itemId}.jpg`;

            // 3. Open the Excel file to fetch the real street address and details
            fetch('Data/itinerary.xlsx')
                .then(res => res.arrayBuffer())
                .then(buffer => {
                    const data = new Uint8Array(buffer);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // Search through the Accommodation Sheet
                    const sheet = workbook.Sheets['Accommodation'];
                    if (!sheet) return;

                    let rowIndex = 4;
                    while (true) {
                        if (!sheet[`A${rowIndex}`]) break;

                        // Check if the current row's ID matches the clicked link ID
                        let refId = sheet[`F${rowIndex}`] ? sheet[`F${rowIndex}`].v : '';
                        if (refId === itemId) {
                            let hotelName = sheet[`B${rowIndex}`].v;
                            let address = sheet[`C${rowIndex}`].v;
                            let city = sheet[`D${rowIndex}`].v;
                            let bookingRef = sheet[`E${rowIndex}`].v;
                            const fullAddress = `${address}, ${city}`;

                            // Insert texts onto webpage
                            document.getElementById('detail-name').innerText = hotelName;
                            document.getElementById('detail-address').innerText = fullAddress;
                            document.getElementById('detail-ref').innerText = bookingRef;

                            // 4. Generate the Google Maps frame using the address text automatically!
                            const encodedAddress = encodeURIComponent(fullAddress);
                            document.getElementById('map-container').innerHTML = `
                                <iframe 
                                    loading="lazy" 
                                    allowfullscreen 
                                    src="https://google.com{encodedAddress}&t=&z=15&ie=UTF8&iwloc=&output=embed">
                                </iframe>`;
                            break;
                        }
                        rowIndex++;
                    }
                });
        });
    </script>
</body>
</html>
